<style>

  --ok:#1E7A4A; --ok-bg:#DFF1E6; --ng:#B3261E; --ng-bg:#F8E1DF; --flag:#9A6700;
  --conc:#CBD3CE; --bar:#7A4E36; --dim:#1F4E8C; --stir:#8A5A40; --dim-in:#FFFFFF;
  --radius:10px; --gutter:16px;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --display:"Dela Gothic One","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}

  :root:not([data-theme="light"]){

    --bg:#12181B; --surface:#1A2226; --surface-2:#243035; --ink:#E4EAEC; --ink-2:#A7B3B8; --line:#35434A;
    --accent:#8DB4EA; --accent-ink:#0D1826; --accent-soft:#1E2F45; --mark:#E8B923; --mark-ink:#12181B;
    --ok:#74D29C; --ok-bg:#16301F; --ng:#F2958C; --ng-bg:#3A1E1C; --flag:#E8B923;
    --conc:#3A454A; --bar:#C98E6C; --dim:#8DB4EA; --stir:#B98264; --dim-in:#12181B;
  }

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12181B; --surface:#1A2226; --surface-2:#243035; --ink:#E4EAEC; --ink-2:#A7B3B8; --line:#35434A;
  --accent:#8DB4EA; --accent-ink:#0D1826; --accent-soft:#1E2F45; --mark:#E8B923; --mark-ink:#12181B;
  --ok:#74D29C; --ok-bg:#16301F; --ng:#F2958C; --ng-bg:#3A1E1C; --flag:#E8B923;
  --conc:#3A454A; --bar:#C98E6C; --dim:#8DB4EA; --stir:#B98264; --dim-in:#12181B;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.9}
ruby{ruby-align:center}
ruby rt{font-size:.52em;line-height:1;color:inherit;opacity:.72;font-weight:400;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding-inline:var(--gutter);padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.02em;line-height:1.3}
.brand small{color:var(--ink-2);font-size:.78rem;line-height:1.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:.8rem;line-height:1}
.seg span{padding:8px 10px;color:var(--ink-2)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-inline:var(--gutter);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:.95rem;line-height:1.4}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}

main{max-width:880px;margin:0 auto;padding-inline:var(--gutter);padding-block:20px 64px}
h1,h2,h3{line-height:1.5;text-wrap:balance;margin:0}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.lead{font-size:1.05rem;margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--ink-2);font-weight:700}

.btn{display:inline-block;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700;line-height:1.4;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.facts{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tbl table{width:100%;border-collapse:collapse;min-width:520px}
.tbl.narrow table{min-width:0}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--surface-2);font-size:.85rem;white-space:nowrap}
.tbl td:first-child{font-weight:700}
.note{border-left:4px solid var(--mark);background:var(--surface);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0}

.req{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.req .panel h3{display:flex;gap:8px;align-items:baseline}
.req dl{margin:.4em 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.req dt{font-weight:700;color:var(--ink-2);font-size:.85rem;padding-top:.35em}
.req dd{margin:0}
.req .num{font-family:var(--display);color:var(--accent);font-size:1.1rem}
.warn{border-color:var(--flag)}

.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);color:var(--ink)}
.sec{scroll-margin-top:120px}
.sec h3{margin-bottom:8px}
.part{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--accent);margin-top:8px}

.quiz-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--ng-bg);color:var(--ng)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--mark);width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--display);font-size:1.2rem}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);line-height:1.6}
.qtext{font-size:1.1rem;margin:0}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-width:520px}
.fig svg{display:block;width:100%;height:auto}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;cursor:pointer;line-height:1.9}
.choice .n{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:.9rem;line-height:1;margin-top:4px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.choice.is-ng{border-color:var(--ng);background:var(--ng-bg)}
.choice.is-ng .n{background:var(--ng);border-color:var(--ng);color:var(--surface)}

.explain{border-radius:var(--radius);padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

.palette button.ok{background:var(--ok-bg);border-color:var(--ok)}
.palette button.ng{background:var(--ng-bg);border-color:var(--ng)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2)}
.confirm{border:1.5px solid var(--flag);background:var(--surface);border-radius:var(--radius);padding:12px 14px}

.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:2.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:2px 12px}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--ng-bg);color:var(--ng)}
.meter{height:10px;background:var(--surface-2);border-radius:99px;position:relative;overflow:visible;min-width:80px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter .line{position:absolute;top:-4px;bottom:-4px;left:75%;width:2px;background:var(--ink)}
.review{display:flex;flex-direction:column;gap:12px}
.review .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.review .item p{margin:.3em 0}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:44px}
.foot{margin-top:24px;font-size:.8rem;color:var(--ink-2)}

/* SVG figures */
.f-conc{fill:var(--conc)} .f-bar{fill:var(--bar)}
.s-face{stroke:var(--ink);stroke-width:2}
.s-stir{fill:none;stroke:var(--stir);stroke-width:14;stroke-linejoin:round}
.s-bar2 path{fill:none;stroke:var(--bar);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.s-dim line{stroke:var(--dim);stroke-width:2}
.s-dim2 line{stroke:var(--dim-in);stroke-width:2.5}
.t-lab text{fill:var(--ink);font-size:15px;font-family:var(--font);font-weight:700}

.lbl{display:none}
@media (max-width:600px){
  .tbl.cards table,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:auto;min-width:0}
  .tbl.cards thead{display:none}
  .tbl.cards tr{border-bottom:1px solid var(--line);padding-block:8px}
  .tbl.cards tr:last-child{border-bottom:0}
  .tbl.cards td{border:0;padding:2px 12px}
  .tbl.cards td:first-child{font-size:1.02rem}
  .tbl.cards .lbl{display:block;font-size:.72rem;letter-spacing:.06em;color:var(--ink-2);font-weight:700;line-height:1.5;margin-top:4px}
}
@media (max-width:520px){
  body{font-size:15.5px}
  .qtext{font-size:1.05rem}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function () {
'use strict';
// ---- core: storage, furigana, tabs, home, notes, glossary ----
var D = window.QDATA, NOTES = window.NOTES, GL = window.GLOSSARY;
var PASS = 0.75;
var EXAM = {
  gakka:   { key: 'gakka',   name: '学科', label: '{学科|がっか}', minutes: 60 },
  jitsugi: { key: 'jitsugi', name: '実技', label: '{実技|じつぎ}', minutes: 40 }
};
var TABS = [
  { id: 'home',    label: 'ホーム' },
  { id: 'notes',   label: '{要点|ようてん}' },
  { id: 'gakka',   label: '{学科|がっか}{模試|もし}' },

var store = {
  get: function (k, d) { try { var v = localStorage.getItem('t2tk:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

var state = { tab: 'home', furi: store.get('furi', 'ruby'), quiz: null, wordQuery: '' };

var RUBY = /\{([^{}|]+)\|([^{}]+)\}/g;
function fx(s) {
  if (s == null) return '';

  if (state.furi === 'paren') return s.replace(RUBY, '$1（$2）');
  return s.replace(RUBY, '$1');
}
function plain(s) { return String(s).replace(RUBY, '$1'); }
function readingText(s) { return String(s).replace(RUBY, '$1 $2'); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function $(sel) { return document.querySelector(sel); }

function renderHeader() {
  var br = $('#brand'); if (br) br.innerHTML = fx('{特定|とくてい}{技能|ぎのう}2{号|ごう} {鉄筋|てっきん}{対策|たいさく}');

  }).join('');

  }).join('');
}

function setTab(id, keepScroll) {
  state.tab = id;
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (e) {}
  render();
  if (!keepScroll) window.scrollTo(0, 0);
}

function render() {
  renderHeader();
  var main = $('#main');
  if (state.tab === 'home') main.innerHTML = viewHome();
  else if (state.tab === 'notes') main.innerHTML = viewNotes();
  else if (state.tab === 'words') { main.innerHTML = viewWords(); var q = $('#wq'); if (q) q.value = state.wordQuery; }
  else main.innerHTML = viewQuiz(state.tab);

}

function bestLine(key) {
  var b = store.get('best:' + key, null), l = store.get('last:' + key, null);
  if (!b && !l) return '<span class="muted small">' + fx('まだ{受|う}けていません') + '</span>';
  var s = [];

  if (b) s.push('{最高|さいこう} ' + b.score + '/' + b.total);
  return '<span class="small">' + fx(s.join('　')) + '</span>';
}

function viewHome() {
  var need = function (n) { return Math.ceil(n * PASS - 1e-9); };
  var h = '';
  h += '<div class="stack">';
  h += '<div class="stack" style="gap:8px"><p class="eyebrow">' + fx('{建設|けんせつ}{分野|ぶんや}{特定|とくてい}{技能|ぎのう}2{号|ごう}{評価|ひょうか}{試験|しけん}（{建築|けんちく}）') + '</p>';
  h += '<h2>' + fx('{鉄筋|てっきん}の{班長|はんちょう}が{押|お}さえることだけ') + '</h2>';
  h += '<p class="lead">' + fx('{要点|ようてん}を{読|よ}む → {模試|もし}を{解|と}く → まちがえた{問題|もんだい}をやり{直|なお}す。これをくり{返|かえ}して、{学科|がっか}・{実技|じつぎ}とも{8割|はちわり}を{目指|めざ}しましょう。') + '</p></div>';

  var card = function (key, qn, min, what) {
    return '<div class="panel"><h3>' + fx(EXAM[key].label) + '</h3><dl>' +
      '<dt>' + fx('{問題|もんだい}') + '</dt><dd>' + fx(qn + '{問|もん}・' + min + '{分|ぷん}') + '</dd>' +
      '<dt>' + fx('{内容|ないよう}') + '</dt><dd>' + fx(what) + '</dd>' +
      '<dt>' + fx('{合格|ごうかく}') + '</dt><dd>' + fx('75%{以上|いじょう}（1{問|もん}1{点|てん}なら' + need(qn) + '{問|もん}）') + '</dd>' +
      '<dt>' + fx('{模試|もし}') + '</dt><dd>' + bestLine(key) + '</dd></dl></div>';
  };
  h += '<div class="req">' + card('gakka', 40, 60, '{全|ぜん}{区分|くぶん}{共通|きょうつう}。{班長|はんちょう}としての{安全|あんぜん}・{工程|こうてい}・{品質|ひんしつ}・{図面|ずめん}・{法令|ほうれい}') +
    card('jitsugi', 25, 40, '{区分|くぶん}{別|べつ}（{建築|けんちく}）。{材料|ざいりょう}・{道具|どうぐ}・{作業|さぎょう}の{知識|ちしき}。{写真|しゃしん}や{図|ず}の{問題|もんだい}もある') + '</div>';
  h += '<p class="small muted" style="margin:0">' + fx('{学科|がっか}と{実技|じつぎ}の{両方|りょうほう}が75%{以上|いじょう}で{合格|ごうかく}。パソコン（CBT）で{受験|じゅけん}し、{問題|もんだい}の{漢字|かんじ}には「設計図（せっけいず）」のようにふりがながつく。') + '</p>';

  h += '<div class="row"><button class="btn primary" type="button" data-go="gakka">' + fx('{学科|がっか}{模試|もし}をはじめる') + '</button><button class="btn primary" type="button" data-go="jitsugi">' + fx('{実技|じつぎ}{模試|もし}をはじめる') + '</button><button class="btn" type="button" data-go="notes">' + fx('{要点|ようてん}を{読|よ}む') + '</button></div>';

  h += '<h3>' + fx('2{号|ごう}になるための2つの{条件|じょうけん}') + '</h3><div class="req">';
  h += '<div class="panel"><h3><span class="num">1</span><span>' + fx('{試験|しけん}に{合格|ごうかく}') + '</span></h3><p style="margin:.4em 0 0">' + fx('{建設|けんせつ}{分野|ぶんや}{特定|とくてい}{技能|ぎのう}2{号|ごう}{評価|ひょうか}{試験|しけん}（{建築|けんちく}{区分|くぶん}）、または{技能|ぎのう}{検定|けんてい}1{級|きゅう}（{鉄筋|てっきん}{施工|せこう}など）。{日本語|にほんご}の{試験|しけん}はいらない。') + '</p></div>';
  h += '<div class="panel warn"><h3><span class="num">2</span><span>' + fx('{班長|はんちょう}の{経験|けいけん}') + '</span></h3><p style="margin:.4em 0 0">' + fx('{鉄筋|てっきん}は、{職長|しょくちょう}・{班長|はんちょう}としての{就業|しゅうぎょう}{日数|にっすう}が3{年|ねん}（645{日|にち}）{以上|いじょう}。{原則|げんそく}としてCCUS（{建設|けんせつ}キャリアアップシステム）の{記録|きろく}で{確認|かくにん}される。') + '</p></div>';
  h += '</div>';
  h += '<div class="note small">' + fx('{試験|しけん}に{合格|ごうかく}しても、{班長|はんちょう}の{経験|けいけん}が{足|た}りないと2{号|ごう}にはなれない。{毎日|まいにち}CCUSカードをタッチして、{職長|しょくちょう}・{班長|はんちょう}としての{記録|きろく}を{残|のこ}すこと。') + '</div>';
  h += '<p class="foot">' + fx('この{模試|もし}は{公式|こうしき}の{問題|もんだい}ではありません。{公式|こうしき}テキスト・サンプル{問題|もんだい}（{建設|けんせつ}{技能|ぎのう}{人材|じんざい}{機構|きこう} JAC）の{出題|しゅつだい}{範囲|はんい}をもとに{作|つく}った{練習|れんしゅう}{問題|もんだい}です。{制度|せいど}は2026{年|ねん}9{月|がつ}{時点|じてん}の{情報|じょうほう}。{最新|さいしん}{情報|じょうほう}は{公式|こうしき}サイトで{確認|かくにん}してください。') + '</p>';
  h += '</div>';
  return h;
}

function renderBlock(b) {
  if (b.t === 'table') {
    var longest = 0;
    b.rows.forEach(function (r) { r.forEach(function (c) { longest = Math.max(longest, plain(c).length); }); });
    var cls = b.head.length <= 2 || longest <= 12 ? ' narrow' : ' cards';
    return '<div class="tbl' + cls + '"><table><thead><tr>' + b.head.map(function (x) { return '<th>' + fx(x) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + b.rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td>' + (i && cls === ' cards' ? '<span class="lbl">' + fx(b.head[i]) + '</span>' : '') + fx(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  if (b.t === 'note') return '<div class="note">' + fx(b.text) + '</div>';
  return '';
}

function viewNotes() {
  var h = '<div class="stack">';
  h += '<h2>' + fx('{要点|ようてん}まとめ') + '</h2>';
  h += '<p class="muted" style="margin:0">' + fx('{学科|がっか}は{全|ぜん}{区分|くぶん}{共通|きょうつう}、{実技|じつぎ}は{建築|けんちく}{区分|くぶん}を{想定|そうてい}し、{鉄筋|てっきん}を{重点|じゅうてん}にしています。') + '</p>';
  h += '<nav class="toc" aria-label="目次">' + NOTES.map(function (n) { return '<a href="#' + n.id + '" data-jump="' + n.id + '">' + fx(n.title) + '</a>'; }).join('') + '</nav>';
  var part = '';
  NOTES.forEach(function (n) {
    if (n.part !== part) {
      part = n.part;
      h += '<p class="part">' + fx(part === '学科' ? '{学科|がっか}（{全|ぜん}{区分|くぶん}{共通|きょうつう}）' : '{実技|じつぎ}（{建築|けんちく}{区分|くぶん}）') + '</p>';
    }
    h += '<section class="sec stack" id="' + n.id + '" style="gap:10px"><h3>' + fx(n.title) + '</h3>' + n.blocks.map(renderBlock).join('') + '</section>';
  });
  h += '</div>';
  return h;
}

function viewWords() {
  var h = '<div class="stack"><h2>' + fx('{用語|ようご}{集|しゅう}') + '</h2>';
  h += '<label for="wq" class="small muted">' + fx('{探|さが}す（{日本語|にほんご}・ひらがな・English）') + '</label>';
  h += '<input id="wq" class="search" type="search" autocomplete="off" placeholder="例：かぶり / splice">';
  h += '<div class="tbl"><table><thead><tr><th>' + fx('{用語|ようご}') + '</th><th>' + fx('{意味|いみ}') + '</th><th>English</th></tr></thead><tbody id="wbody">' + wordRows() + '</tbody></table></div></div>';
  return h;
}

function wordRows() {
  var q = state.wordQuery.trim().toLowerCase();
  var rows = GL.filter(function (g) {
    if (!q) return true;
    return (readingText(g[0]) + ' ' + readingText(g[1]) + ' ' + g[2]).toLowerCase().indexOf(q) >= 0;
  });
  if (!rows.length) return '<tr><td colspan="3">' + fx('{見|み}つかりません') + '</td></tr>';
  return rows.map(function (g) { return '<tr><td>' + fx(g[0]) + '</td><td>' + fx(g[1]) + '</td><td>' + esc(g[2]) + '</td></tr>'; }).join('');
}

// ---- quiz engine ----
var CAT_LABEL = {
  '班長の職務': '{班長|はんちょう}の{職務|しょくむ}', '現場管理': '{現場|げんば}{管理|かんり}', '安全衛生': '{安全|あんぜん}{衛生|えいせい}',
  '図面': '{設計|せっけい}{図書|としょ}・{施工図|せこうず}', '建設業': '{建設業|けんせつぎょう}のしくみ・{法令|ほうれい}',
  '鉄筋': '{鉄筋|てっきん}', '材料・作業': 'コンクリート・{型枠|かたわく}', '工具・測定': '{工具|こうぐ}・{測定|そくてい}', '作業の安全': '{作業|さぎょう}の{安全|あんぜん}'
};
var NUMS = ['1', '2', '3', '4'];
var ticker = null;
state.quiz = state.quiz || {};

function byId(key, id) { for (var i = 0; i < D[key].length; i++) if (D[key][i].id === id) return D[key][i]; return null; }
function shuffled(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }

function newQuiz(key, mode, shuffle, onlyIds) {
  var list = onlyIds ? D[key].filter(function (q) { return onlyIds.indexOf(q.id) >= 0; }) : D[key];
  return {
    key: key, mode: mode, only: !!onlyIds, idx: 0, startedAt: Date.now(), usedSec: 0, done: false,
    confirm: null, showAll: false,
    items: list.map(function (q) { return { id: q.id, order: shuffle && !q.keep ? shuffled([0, 1, 2, 3]) : [0, 1, 2, 3], pick: null, flag: false }; })
  };
}
function remaining(z) { return z.mode === 'exam' ? EXAM[z.key].minutes * 60 - (Date.now() - z.startedAt) / 1000 : null; }
function answeredCount(z) { return z.items.filter(function (it) { return it.pick !== null; }).length; }

function startTicker() { stopTicker(); ticker = setInterval(tick, 1000); }
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
function tick() {
  var z = state.quiz[state.tab];
  if (!z || z.done || z.mode !== 'exam') return;
  var r = remaining(z), el = $('#timer');
  if (r <= 0) { finish(z, true); return; }
  if (el) { el.textContent = mmss(r); el.classList.toggle('low', r <= 300); }
}

function viewQuiz(key) {
  var z = state.quiz[key];
  if (!z) return viewStart(key);

  return viewQuestion(z);
}

function viewStart(key) {

    : '{建築|けんちく}{区分|くぶん}を{想定|そうてい}した{実技|じつぎ}。{鉄筋|てっきん}を{中心|ちゅうしん}に、コンクリート・{型枠|かたわく}・{道具|どうぐ}・{作業|さぎょう}の{安全|あんぜん}から{出題|しゅつだい}。{図|ず}の{問題|もんだい}もある。') + '</p>';
  h += '<div class="panel stack" style="gap:10px"><fieldset style="border:0;margin:0;padding:0" class="stack"><legend class="eyebrow" style="margin-bottom:6px">' + fx('モードを{選|えら}ぶ') + '</legend>';
  h += '<label class="row" style="gap:8px;align-items:flex-start"><input type="radio" name="mode-' + key + '" id="mode-exam-' + key + '" value="exam" checked style="margin-top:.55em"><span><b>' + fx('{本番|ほんばん}モード') + '</b><br><span class="small muted">' + fx('{時間|じかん}を{計|はか}る。{答|こた}えと{解説|かいせつ}は{最後|さいご}にまとめて{見|み}る。') + '</span></span></label>';
  h += '<label class="row" style="gap:8px;align-items:flex-start"><input type="radio" name="mode-' + key + '" id="mode-prac-' + key + '" value="practice" style="margin-top:.55em"><span><b>' + fx('{練習|れんしゅう}モード') + '</b><br><span class="small muted">' + fx('1{問|もん}ごとに{答|こた}えと{解説|かいせつ}を{見|み}る。{時間|じかん}は{計|はか}らない。') + '</span></span></label></fieldset>';
  h += '<label class="row small" style="gap:8px;align-items:center"><input type="checkbox" id="shuf-' + key + '"><span>' + fx('{選択肢|せんたくし}の{順番|じゅんばん}を{毎回|まいかい}{入|い}れ{替|か}える') + '</span></label>';
  h += '<div class="row"><button class="btn primary" type="button" data-start="' + key + '">' + fx('はじめる') + '</button>';
  if (wrong.length) h += '<button class="btn" type="button" data-retry="' + key + '">' + fx('{前回|ぜんかい}まちがえた' + wrong.length + '{問|もん}だけ{練習|れんしゅう}') + '</button>';
  h += '</div>' + bestLine(key) + '</div></div>';
  return h;
}

function viewQuestion(z) {
  var it = z.items[z.idx], q = byId(z.key, it.id), n = z.items.length;
  var practiceShown = z.mode === 'practice' && it.pick !== null;
  var h = '<div class="stack">';
  h += '<div class="quiz-bar"><div class="row" style="align-items:center;gap:8px"><b>' + fx(EXAM[z.key].label + '{模試|もし}') + '</b><span class="chip">' + fx(z.mode === 'exam' ? '{本番|ほんばん}' : '{練習|れんしゅう}') + '</span></div>';
  if (z.mode === 'exam') { var r = remaining(z); h += '<div class="timer' + (r <= 300 ? ' low' : '') + '" id="timer" aria-live="off">' + mmss(r) + '</div>'; }
  h += '</div>';
  h += '<div class="progress" aria-hidden="true"><i style="width:' + Math.round(answeredCount(z) / n * 100) + '%"></i></div>';
  h += '<div class="qhead"><span class="qno">' + fx('{第|だい}' + (z.idx + 1) + '{問|もん}') + '</span><span class="chip">' + fx(CAT_LABEL[q.cat] || q.cat) + '</span><span class="small muted">' + answeredCount(z) + ' / ' + n + ' ' + fx('{回答|かいとう}{済|ず}み') + '</span></div>';
  h += '<p class="qtext">' + fx(q.q) + '</p>';
  if (q.fig) h += '<div class="fig">' + q.fig + '</div>';
  h += '<ol class="choices">';
  it.order.forEach(function (orig, pos) {
    var cls = 'choice', pressed = it.pick === orig;
    if (practiceShown) { if (orig === q.a) cls += ' is-ok'; else if (pressed) cls += ' is-ng'; }
    h += '<li><button type="button" class="' + cls + '" data-pick="' + orig + '" aria-pressed="' + pressed + '"' + (practiceShown ? ' disabled' : '') + '><span class="n">' + NUMS[pos] + '</span><span>' + fx(q.c[orig]) + '</span></button></li>';
  });
  h += '</ol>';
  if (practiceShown) {
    var ok = it.pick === q.a;
    h += '<div class="explain" role="status"><p class="verdict ' + (ok ? 'ok' : 'ng') + '" style="margin:0">' + fx(ok ? '{正解|せいかい}！' : '{不正解|ふせいかい}。{正|ただ}しい{答|こた}えは ' + NUMS[it.order.indexOf(q.a)] + ' {番|ばん}') + '</p><p style="margin:.4em 0 0">' + fx(q.e) + '</p></div>';
  }
  h += '<div class="nav"><button class="btn" type="button" data-nav="-1"' + (z.idx === 0 ? ' disabled' : '') + '>' + fx('← {前|まえ}へ') + '</button>';
  h += '<button class="btn ghost" type="button" data-flag aria-pressed="' + it.flag + '">' + fx(it.flag ? '★ {見直|みなお}し{中|ちゅう}' : '☆ あとで{見直|みなお}す') + '</button>';
  h += '<button class="btn' + (z.idx === n - 1 ? '' : ' primary') + '" type="button" data-nav="1"' + (z.idx === n - 1 ? ' disabled' : '') + '>' + fx('{次|つぎ}へ →') + '</button></div>';
  h += '<div class="panel stack" style="gap:10px"><div class="palette" role="group" aria-label="問題の一覧">' + z.items.map(function (x, i) {
    var c = []; if (x.pick !== null) c.push('ans'); if (x.flag) c.push('flag'); if (i === z.idx) c.push('cur');
    if (z.mode === 'practice' && x.pick !== null) c.push(x.pick === byId(z.key, x.id).a ? 'ok' : 'ng');
    return '<button type="button" class="' + c.join(' ') + '" data-goto="' + i + '" aria-label="' + (i + 1) + '">' + (i + 1) + '</button>';
  }).join('') + '</div>';
  h += '<div class="legend"><span>' + fx('{灰色|はいいろ}＝{回答|かいとう}{済|ず}み') + '</span><span>' + fx('{黄|き}の{点|てん}＝{見直|みなお}し') + '</span><span>' + fx('{枠|わく}＝{今|いま}の{問題|もんだい}') + '</span></div></div>';
  if (z.confirm === 'finish') {
    h += '<div class="confirm stack" style="gap:8px"><p style="margin:0">' + fx('まだ{答|こた}えていない{問題|もんだい}が' + (n - answeredCount(z)) + '{問|もん}あります。{採点|さいてん}しますか？') + '</p><div class="row"><button class="btn primary" type="button" data-yes="finish">' + fx('{採点|さいてん}する') + '</button><button class="btn" type="button" data-no>' + fx('もどる') + '</button></div></div>';
  } else if (z.confirm === 'quit') {
    h += '<div class="confirm stack" style="gap:8px"><p style="margin:0">' + fx('{模試|もし}をやめますか？{答|こた}えは{消|き}えます。') + '</p><div class="row"><button class="btn primary" type="button" data-yes="quit">' + fx('やめる') + '</button><button class="btn" type="button" data-no>' + fx('{続|つづ}ける') + '</button></div></div>';
  } else {
    h += '<div class="row"><button class="btn primary" type="button" data-finish>' + fx(z.mode === 'exam' ? '{採点|さいてん}する' : '{結果|けっか}を{見|み}る') + '</button><button class="btn ghost" type="button" data-quit>' + fx('やめる') + '</button></div>';
  }
  h += '</div>';
  return h;
}

function finish(z, timeUp) {
  z.done = true; z.timeUp = !!timeUp; z.confirm = null;
  z.usedSec = Math.round((Date.now() - z.startedAt) / 1000);
  var score = 0, wrong = [];
  z.items.forEach(function (it) { if (it.pick === byId(z.key, it.id).a) score++; else wrong.push(it.id); });
  z.score = score;
  if (!z.only) {
    var rec = { score: score, total: z.items.length, at: Date.now() };
    store.set('last:' + z.key, rec);
    var best = store.get('best:' + z.key, null);
    if (!best || score > best.score) store.set('best:' + z.key, rec);
  }
  if (!z.only || wrong.length) store.set('wrong:' + z.key, wrong);
  else store.set('wrong:' + z.key, []);
  if (state.tab === z.key) render();
}

function viewResult(z) {
  var n = z.items.length, pct = Math.round(z.score / n * 100), need = Math.ceil(n * PASS - 1e-9), pass = z.score >= need;
  var h = '<div class="stack">';
  h += '<h2>' + fx(EXAM[z.key].label + '{模試|もし}の{結果|けっか}' + (z.only ? '（まちがえた{問題|もんだい}）' : '')) + '</h2>';
  if (z.timeUp) h += '<p class="note" style="margin:0">' + fx('{時間|じかん}{切|ぎ}れで{採点|さいてん}しました。') + '</p>';
  h += '<div class="panel stack" style="gap:10px"><div class="score"><span class="big">' + z.score + ' / ' + n + '</span><span>' + pct + '%</span>';
  h += '<span class="badge ' + (pass ? 'pass' : 'fail') + '">' + fx(pass ? '{合格|ごうかく}ライン（75%）{達成|たっせい}' : '{合格|ごうかく}ラインまで あと' + (need - z.score) + '{問|もん}') + '</span></div>';
  if (z.mode === 'exam') h += '<p class="small muted" style="margin:0">' + fx('かかった{時間|じかん} ' + mmss(Math.min(z.usedSec, EXAM[z.key].minutes * 60)) + '（{制限|せいげん} ' + EXAM[z.key].minutes + '{分|ぷん}）') + '</p>';
  h += '</div>';
  var cats = {};
  z.items.forEach(function (it) { var q = byId(z.key, it.id); var c = cats[q.cat] || (cats[q.cat] = { n: 0, ok: 0 }); c.n++; if (it.pick === q.a) c.ok++; });
  h += '<div class="tbl narrow"><table><thead><tr><th>' + fx('{分野|ぶんや}') + '</th><th>' + fx('{正解|せいかい}') + '</th><th style="width:40%">' + fx('{正答率|せいとうりつ}（{線|せん}＝75%）') + '</th></tr></thead><tbody>';
  Object.keys(cats).forEach(function (k) { var c = cats[k]; h += '<tr><td>' + fx(CAT_LABEL[k] || k) + '</td><td style="font-variant-numeric:tabular-nums">' + c.ok + ' / ' + c.n + '</td><td><div class="meter"><i style="width:' + Math.round(c.ok / c.n * 100) + '%"></i><span class="line"></span></div></td></tr>'; });
  h += '</tbody></table></div>';
  var wrongIds = z.items.filter(function (it) { return it.pick !== byId(z.key, it.id).a; });
  h += '<div class="row">';
  if (wrongIds.length) h += '<button class="btn primary" type="button" data-retry="' + z.key + '">' + fx('まちがえた' + wrongIds.length + '{問|もん}を{練習|れんしゅう}') + '</button>';
  h += '<button class="btn" type="button" data-restart="' + z.key + '">' + fx('{最初|さいしょ}から') + '</button>';
  h += '<button class="btn ghost" type="button" data-showall aria-pressed="' + z.showAll + '">' + fx(z.showAll ? 'まちがえた{問題|もんだい}だけ{表示|ひょうじ}' : '{全問|ぜんもん}の{解説|かいせつ}を{見|み}る') + '</button></div>';
  var list = z.showAll ? z.items : wrongIds;
  h += '<h3>' + fx(z.showAll ? '{全問|ぜんもん}の{答|こた}えと{解説|かいせつ}' : 'まちがえた{問題|もんだい}の{解説|かいせつ}') + '</h3>';
  if (!list.length) h += '<p style="margin:0">' + fx('{全問|ぜんもん}{正解|せいかい}です。') + '</p>';
  h += '<div class="review">' + list.map(function (it) {
    var q = byId(z.key, it.id), i = z.items.indexOf(it), ok = it.pick === q.a;
    var yours = it.pick === null ? fx('（{未回答|みかいとう}）') : NUMS[it.order.indexOf(it.pick)] + '. ' + fx(q.c[it.pick]);
    return '<div class="item"><p class="qhead" style="margin:0"><b>' + fx('{第|だい}' + (i + 1) + '{問|もん}') + '</b><span class="chip">' + fx(CAT_LABEL[q.cat] || q.cat) + '</span><span class="verdict ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '○' : '×') + '</span></p>' +
      '<p>' + fx(q.q) + '</p>' + (q.fig ? '<div class="fig">' + q.fig + '</div>' : '') +
      '<p class="small">' + fx('あなたの{答|こた}え：') + yours + '</p>' +
      '<p class="small"><b>' + fx('{正解|せいかい}：') + NUMS[it.order.indexOf(q.a)] + '. ' + fx(q.c[q.a]) + '</b></p>' +
      '<p class="small muted">' + fx(q.e) + '</p></div>';
  }).join('') + '</div></div>';
  return h;
}

function pick(z, orig) {
  var it = z.items[z.idx];
  if (z.mode === 'practice' && it.pick !== null) return;
  it.pick = orig; z.confirm = null;
  render();
}
function go(z, i) { if (i < 0 || i >= z.items.length) return; z.idx = i; z.confirm = null; render(); window.scrollTo(0, 0); }

document.addEventListener('click', function (e) {
  var t = e.target.closest('button, a[data-jump]'); if (!t) return;
  var d = t.dataset, z = state.quiz[state.tab];
  if (d.furi) { state.furi = d.furi; store.set('furi', d.furi); render(); return; }
  if (d.tab) { setTab(d.tab); return; }
  if (d.go) { setTab(d.go); return; }
  if (d.jump) { e.preventDefault(); var s = document.getElementById(d.jump); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.start) {
    var m = document.querySelector('input[name="mode-' + d.start + '"]:checked');
    var sh = document.getElementById('shuf-' + d.start);
    state.quiz[d.start] = newQuiz(d.start, m ? m.value : 'exam', sh ? sh.checked : false, null); render(); window.scrollTo(0, 0); return;
  }
  if (d.retry) { var w = store.get('wrong:' + d.retry, []); if (!w.length) return; state.quiz[d.retry] = newQuiz(d.retry, 'practice', true, w); setTab(d.retry); return; }
  if (d.restart) { state.quiz[d.restart] = null; render(); window.scrollTo(0, 0); return; }
  if (!z) return;
  if (d.pick !== undefined) { pick(z, Number(d.pick)); return; }
  if (d.nav) { go(z, z.idx + Number(d.nav)); return; }
  if (d.goto !== undefined) { go(z, Number(d.goto)); return; }
  if (t.hasAttribute('data-flag')) { z.items[z.idx].flag = !z.items[z.idx].flag; render(); return; }
  if (t.hasAttribute('data-finish')) { if (answeredCount(z) < z.items.length) { z.confirm = 'finish'; render(); } else finish(z, false); return; }
  if (t.hasAttribute('data-quit')) { z.confirm = 'quit'; render(); return; }
  if (d.yes === 'finish') { finish(z, false); window.scrollTo(0, 0); return; }
  if (d.yes === 'quit') { state.quiz[state.tab] = null; render(); return; }
  if (t.hasAttribute('data-no')) { z.confirm = null; render(); return; }
  if (t.hasAttribute('data-showall')) { z.showAll = !z.showAll; render(); return; }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'wq') { state.wordQuery = e.target.value; var b = $('#wbody'); if (b) b.innerHTML = wordRows(); }
});

document.addEventListener('keydown', function (e) {
  var z = state.quiz[state.tab];
  if (!z || z.done || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  var k = NUMS.indexOf(e.key);
  if (k >= 0) { pick(z, z.items[z.idx].order[k]); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { go(z, z.idx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(z, z.idx - 1); e.preventDefault(); }
});

function start(data) {
  data = data || {};
  if (data.quiz) state.quiz = data.quiz;
  var h = (location.hash || '').slice(1);
  var ok = TABS.some(function (t) { return t.id === h; });
  state.tab = data.tab || (ok ? h : 'home');
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(function () { return { tab: state.tab, quiz: state.quiz }; }); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カットリスト作成">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B2229" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>カットリスト作成</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="gateStyle">
/* 入口の画面: 合言葉を入れて「ログイン」。入力ページの中身は、合言葉が合うまで読めない形(暗号)で下に入っている。 */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#17212B; --muted:#586573; --line:#D2D9E0;
  --accent:#0B5CAD; --accent-ink:#FFFFFF; --over:#C0262D;
  --font-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12171C; --panel:#1B2229; --ink:#E8EDF2; --muted:#9AA7B4; --line:#2F3A45; --accent:#5AA2F0; --accent-ink:#0B1117; --over:#FF8078; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#12171C; --panel:#1B2229; --ink:#E8EDF2; --muted:#9AA7B4; --line:#2F3A45; --accent:#5AA2F0; --accent-ink:#0B1117; --over:#FF8078; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.gate{box-sizing:border-box;min-height:60vh;display:grid;place-items:center;padding-block:36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate *{box-sizing:border-box}
.gate-in{width:100%;max-width:400px;display:grid;gap:18px}
.gate h1{margin:0;font-size:26px;letter-spacing:.04em;text-wrap:balance}
.gate form{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.gate label{font-size:14px;color:var(--muted)}
.gate [hidden]{display:none!important}
.gate .pw{display:flex;gap:8px}
.gate input{flex:1;min-width:0;width:100%;height:52px;font:inherit;font-size:20px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.gate .show{min-width:64px;height:52px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px;touch-action:manipulation}
.gate .go{width:100%;min-height:54px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:19px;font-weight:700;letter-spacing:.08em;touch-action:manipulation}
.gate .go:disabled{opacity:.5}
.gate .note{margin:0;font-size:14px;color:var(--muted)}
.gate .err{margin:0;font-size:15px;color:var(--over)}
.gate .forget{justify-self:start;border:0;background:transparent;color:var(--accent);font:inherit;font-size:15px;padding:8px 2px;text-decoration:underline;text-underline-offset:3px}
.gate .made{margin:0;font-size:12px;color:var(--muted);text-align:center}
.gate button:focus-visible,.gate input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="gate-in">
    <h1>カットリスト作成</h1>
    <form id="gateForm" autocomplete="off" novalidate>
      <label for="gatePass">合言葉</label>
      <div class="pw">
        <input id="gatePass" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="show" id="gateShow" aria-pressed="false">表示</button>
      </div>
      <p class="note" id="gateNote" hidden>この端末は合言葉を覚えています。「ログイン」を押してください。</p>
      <p class="err" id="gateErr" role="alert" hidden></p>
      <button type="submit" class="go" id="gateBtn">ログイン</button>
      <button type="button" class="forget" id="gateForget" hidden>合言葉を入れ直す</button>
    </form>
    <p class="made" style="margin:0;font-size:12px;color:var(--muted);text-align:center">作成：株式会社山村組</p>
  </div>
</main>
<div id="app" hidden></div>

  var STORE = 'cutlist-gate-v1', DOTS = '●●●●●●●●';
  var remembered = null;                     // この端末が覚えている鍵
  function $(id) { return document.getElementById(id); }
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function say(msg) { var e = $('gateErr'); e.textContent = msg || ''; e.hidden = !msg; }
  function busy(on) { var b = $('gateBtn'); b.disabled = on; b.textContent = on ? '確かめています…' : 'ログイン'; }

  // 合言葉から鍵を作る(全角と半角・大文字と小文字・前後の空白の違いは同じ物として扱う)。🔴 gate_crypto.js の norm() と同じ式
  function derive(pass) {
    var raw = new TextEncoder().encode(String(pass).normalize('NFKC').trim().toLowerCase());
    return crypto.subtle.importKey('raw', raw, 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.it, hash: 'SHA-256' }, k, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function open(key) {
    return crypto.subtle.importKey('raw', key, { name: 'AES-GCM' }, false, ['decrypt']).then(function (k) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, k, bytes(P.ct));
    }).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  // 開いた中身を画面に出す。script は入れ直さないと動かない
  function mount(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    var codes = [];
    Array.prototype.forEach.call(tpl.content.querySelectorAll('script'), function (s) { codes.push(s.textContent); s.remove(); });
    Array.prototype.forEach.call(tpl.content.querySelectorAll('title,meta'), function (m) { m.remove(); });
    var gate = $('gate'), st = $('gateStyle'), app = $('app');
    if (gate) gate.remove();
    if (st) st.remove();
    app.appendChild(tpl.content); app.hidden = false;
    codes.forEach(function (code) { var el = document.createElement('script'); el.textContent = code; document.body.appendChild(el); });
    window.scrollTo(0, 0);
  }
  // 合言葉の種類(P.kb)に合わせて欄を変える: 数字だけ=数字のキー / 半角の英数字=英字のキー(伏せ字) / かな・漢字入り=ふつうの欄(伏せ字にすると iPhone で日本語を打てない)
  function setRemembered(on) {
    var inp = $('gatePass'), show = $('gateShow'), plain = P.kb === 'any';
    $('gateNote').hidden = !on; $('gateForget').hidden = !on; show.hidden = on || plain;
    inp.readOnly = on; inp.type = (on || !plain) ? 'password' : 'text'; inp.value = on ? DOTS : '';
    if (P.kb === 'num' && !on) inp.setAttribute('inputmode', 'numeric'); else inp.removeAttribute('inputmode');
    show.setAttribute('aria-pressed', 'false'); show.textContent = '表示';
  }
  function forget() {
    remembered = null;
    try { localStorage.removeItem(STORE); } catch (e) { /* 無くてもよい */ }
    setRemembered(false);
    try { $('gatePass').focus(); } catch (e) { /* 無くてもよい */ }
  }

  function login(ev) {
    if (ev) ev.preventDefault();
    say('');
    if (!window.crypto || !crypto.subtle) { say('このページは https の番地で開いてください。'); return; }
    var useKey = remembered, typed = $('gatePass').value;
    if (!useKey && !String(typed).trim()) { say('合言葉を入れてください。'); return; }
    busy(true);
    (useKey ? Promise.resolve(useKey) : derive(typed)).then(function (key) {
      return open(key).then(function (html) {
        if (!useKey) { try { localStorage.setItem(STORE, JSON.stringify({ kid: P.kid, key: toB64(key) })); } catch (e) { /* 覚えられなくても入れる */ } }
        mount(html);
      });
    }).catch(function () {
      busy(false);
      if (useKey) { forget(); say('合言葉が変わりました。新しい合言葉を入れてください。'); }
      else { say('合言葉が違います。'); try { $('gatePass').select(); } catch (e) { /* 無くてもよい */ } }
    });
  }

  $('gateForm').addEventListener('submit', login);
  $('gateForget').addEventListener('click', function () { say(''); forget(); });
  $('gateShow').addEventListener('click', function () {
    var inp = $('gatePass'), on = inp.type === 'password';
    inp.type = on ? 'text' : 'password';
    $('gateShow').setAttribute('aria-pressed', on ? 'true' : 'false'); $('gateShow').textContent = on ? '隠す' : '表示';
  });
  try {
    var s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s && s.kid === P.kid && typeof s.key === 'string') remembered = bytes(s.key);
  } catch (e) { remembered = null; }
  setRemembered(!!remembered);
})();
